# NOT DEPLOYED — kept for reference only; eurollm-22b-instruct-fp8 is the active model in hsworkshop
model:
  name: "gpt-oss-20b"
  displayName: "GPT-OSS 20B"
  sourceUri: "oci://quay.io/castawayegr/modelcar-catalog:gpt-oss-20b"
  format: "vLLM"

namespace:
  name: "hsworkshop"

runtime:
  name: "vllm-cuda-runtime-gptoss-hs"
  displayName: "GPT-OSS 20B vLLM Runtime"
  image: "registry.redhat.io/rhaiis/vllm-cuda-rhel9@sha256:ec799bb5eeb7e25b4b25a8917ab5161da6b6f1ab830cbba61bba371cffb0c34d"
  annotations:
    acceleratorName: "nvidia-gpu"
    apiProtocol: "REST"
    hardwareProfileName: ""
    recommendedAccelerators: '["nvidia.com/gpu"]'
    runtimeVersion: "v0.13.0"
    servingRuntimeScope: "global"
    templateDisplayName: "GPT-OSS 20B vLLM Runtime"
    templateName: "vllm-cuda-runtime-gptoss-hs"
  extraArgs:
    # --chat-template dropped: the path was inside the old castawayegr image only.
    # rhaiis vLLM 0.13.0 will use the model's built-in chat template via tokenizer_config.json.
    # If chat formatting looks wrong, add a template via ConfigMap volume mount instead.
    - --max-model-len=10000
    - --gpu-memory-utilization=0.95

inference:
  name: "gpt-oss-20b-service"
  displayName: "GPT-OSS 20B Service"
  scaling:
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
      gpu: "1"
    limits:
      cpu: "8"
      memory: "10Gi"
      gpu: "1"
  tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists

connection:
  name: ""
