# IMPORTANT: Replace all placeholder values before deploying.
# Use Sealed Secrets or External Secrets Operator for production.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: hsworkshop
type: Opaque
stringData:
  POSTGRES_DB: langfuse
  POSTGRES_USER: langfuse
  # CHANGE THIS before deploying
  POSTGRES_PASSWORD: changeme-postgres-password
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-secret
  namespace: hsworkshop
type: Opaque
stringData:
  CLICKHOUSE_USER: clickhouse
  # CHANGE THIS before deploying
  CLICKHOUSE_PASSWORD: changeme-clickhouse-password
---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secret
  namespace: hsworkshop
type: Opaque
stringData:
  # CHANGE THESE before deploying - use random 32+ char strings
  NEXTAUTH_SECRET: changeme-nextauth-secret-min32chars
  SALT: changeme-salt-min32chars-xxxxxxxxxxx
  # 32 hex chars (generate with: openssl rand -hex 16)
  ENCRYPTION_KEY: changeme00000000000000000000000000
  DATABASE_URL: postgresql://langfuse:changeme-postgres-password@postgres:5432/langfuse
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: changeme-clickhouse-password
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-secret
  namespace: hsworkshop
type: Opaque
stringData:
  # CHANGE THIS before deploying
  WEBUI_SECRET_KEY: changeme-webui-secret-min32chars-xx
  # Langfuse API keys - create in Langfuse UI after first deploy,
  # then update and restart the OpenWebUI pod
  LANGFUSE_PUBLIC_KEY: pk-lf-placeholder
  LANGFUSE_SECRET_KEY: sk-lf-placeholder
