# Secret for guardrails-proxy Langfuse integration.
# NOT managed by ArgoCD — create/update manually when switching runs:
#
#   oc create secret generic guardrails-langfuse-secret -n hsworkshop \
#     --from-literal=LANGFUSE_HOST=http://langfuse:3000 \
#     --from-literal=LANGFUSE_PUBLIC_KEY=pk-lf-... \
#     --from-literal=LANGFUSE_SECRET_KEY=sk-lf-... \
#     --dry-run=client -o yaml | oc apply -f -
#
# After updating the secret, restart the proxy:
#   oc rollout restart deployment/guardrails-proxy -n hsworkshop
#
# Create one API key per Langfuse project (testing-evalution, run-1, run-2)
# in the Langfuse UI: Settings → API Keys → Create new key.
# Use the key that matches the project OpenWebUI is currently tracing into.
apiVersion: v1
kind: Secret
metadata:
  name: guardrails-langfuse-secret
  namespace: hsworkshop
  annotations:
    # Exclude from ArgoCD management — credentials are applied manually
    argocd.argoproj.io/sync-options: "Prune=false"
type: Opaque
stringData:
  LANGFUSE_HOST: "http://langfuse:3000"
  LANGFUSE_PUBLIC_KEY: "pk-lf-REPLACE-ME"
  LANGFUSE_SECRET_KEY: "sk-lf-REPLACE-ME"
